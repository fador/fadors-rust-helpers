[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fador/fadors-rust-helpers"
authors = ["Marko Viitanen <fador@iki.fi>"]

[workspace.dependencies]
fador-auth = { path = "crates/fador-auth", version = "0.1.0" }
fador-compress = { path = "crates/fador-compress", version = "0.1.0" }
fador-core = { path = "crates/fador-core", version = "0.1.0" }
fador-http = { path = "crates/fador-http", version = "0.1.0" }
fador-i18n = { path = "crates/fador-i18n", version = "0.1.0" }
fador-markup = { path = "crates/fador-markup", version = "0.1.0" }
fador-mysql = { path = "crates/fador-mysql", version = "0.1.0" }
fador-phpbb-template = { path = "crates/fador-phpbb-template", version = "0.1.0" }
fador-services = { path = "crates/fador-services", version = "0.1.0" }
fador-smf-theme = { path = "crates/fador-smf-theme", version = "0.1.0" }
fador-testutil = { path = "crates/fador-testutil", version = "0.1.0" }
fador-thumb = { path = "crates/fador-thumb", version = "0.1.0" }
fador-wikitext = { path = "crates/fador-wikitext", version = "0.1.0" }
