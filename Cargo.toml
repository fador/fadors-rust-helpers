[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fador/fadors-rust-helpers"
authors = ["Marko Viitanen <fador@iki.fi>"]

[workspace.dependencies]
fador-compress = { path = "crates/fador-compress", version = "0.1.0" }
fador-core = { path = "crates/fador-core", version = "0.1.0" }
fador-mysql = { path = "crates/fador-mysql", version = "0.1.0" }
fador-testutil = { path = "crates/fador-testutil", version = "0.1.0" }
